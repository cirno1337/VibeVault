name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint with ruff
        run: ruff check .
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build

  extension:
    name: Browser Extension Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configs
        run: |
          cp .env.example .env
          docker compose config
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml config
          rm .env
      - name: Build Docker image
        run: docker build -t vibevault:ci .
      - name: Run container and test /readyz
        run: |
          docker run -d --name vibevault -p 8787:8787 \
            -e VIBEVAULT_ADMIN_TOKEN=ci-smoke-test-token-at-least-16-chars \
            -e VIBEVAULT_INGEST_TOKENS=test=ci-smoke-test-ingest-token-16-chars \
            vibevault:ci

          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8787/readyz > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Waiting for server to become ready ($i/30)..."
            sleep 1
          done
          echo "Server failed to become ready within 30 seconds"
          docker logs vibevault
          exit 1
      - name: Clean up container
        if: always()
        run: |
          docker stop vibevault || true
          docker rm vibevault || true
